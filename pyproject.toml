[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-export"
version = "0.1.0"
description = "Export Claude Code CLI sessions to HTML, Markdown, JSON, CSV — with the project's CLAUDE.md and any files the assistant touched bundled alongside."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["claude", "claude-code", "export", "transcript", "anthropic", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/PeriChu/claude-code-export"
Repository = "https://github.com/PeriChu/claude-code-export"
Issues = "https://github.com/PeriChu/claude-code-export/issues"

[project.scripts]
claude-code-export = "claude_code_export:main"
cc-export = "claude_code_export:main"

[tool.setuptools]
py-modules = ["claude_code_export"]
